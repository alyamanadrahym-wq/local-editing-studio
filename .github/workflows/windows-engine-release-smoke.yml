name: Windows engine release smoke

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create this release tag only after CPU and RTX qualification (leave blank for test-only)"
        required: false
        type: string
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  cpu:
    name: Windows CPU + libx264
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: artifacts/local-editing-studio/local-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: artifacts/local-editing-studio/local-engine/requirements.txt
      - name: Install pinned release FFmpeg
        shell: powershell
        run: .\windows\setup-release-ffmpeg.ps1
      - name: Install engine
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run real Windows release suite
        shell: powershell
        env:
          WINDOWS_RELEASE_SMOKE: "1"
          WHISPER_MODEL: tiny
        run: python -m pytest -q -m windows_release

  rtx:
    name: Windows RTX + CUDA + NVENC
    runs-on: [self-hosted, Windows, X64, RTX]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: artifacts/local-editing-studio/local-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: artifacts/local-editing-studio/local-engine/requirements.txt
      - name: Install pinned release FFmpeg
        shell: powershell
        run: .\windows\setup-release-ffmpeg.ps1
      - name: Install engine and verify RTX runner prerequisites
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          Get-Command ffmpeg
          Get-Command ffprobe
          Get-Command nvidia-smi
      - name: Run real RTX release suite
        shell: powershell
        env:
          WINDOWS_RELEASE_SMOKE: "1"
          EXPECT_RTX: "1"
          WHISPER_MODEL: tiny
        run: python -m pytest -q -m windows_release

  release:
    name: Create release after Windows qualification
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
    needs: [cpu, rtx]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create qualified GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TARGET_SHA: ${{ github.sha }}
        run: gh release create "$RELEASE_TAG" --target "$TARGET_SHA" --generate-notes
